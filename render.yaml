services:
  - type: web
    name: stock-ledger-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_ENABLED
        value: false

